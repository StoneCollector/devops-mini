# Test Configuration for Integration Tests
spring.application.name=smart-catering-services-test

# Database Config - Defaults to DOPSnet from run.bat if environment variable not set
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cbms_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:DOPSnet}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Thymeleaf Config
spring.thymeleaf.cache=false

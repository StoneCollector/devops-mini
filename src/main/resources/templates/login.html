<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Catering Services</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v='2.0')}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="page-container">
        <div class="auth-card-container">
            <div class="auth-card">
                <h2>Welcome Back</h2>
                <p class="auth-subtitle">Sign in to your Smart Catering Services account</p>

                <!-- Feedback Alerts -->
                <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>
                <div class="alert alert-success" th:if="${param.registered}">Registration successful! Please login with your credentials.</div>
                <div class="alert alert-info" th:if="${param.logout}">You have been successfully logged out.</div>

                <form th:action="@{/login}" method="post">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" class="form-control" 
                               th:value="${email}" placeholder="name@example.com" required autofocus>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" class="form-control" 
                               placeholder="Enter your password" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-full">Sign In</button>
                </form>

                <p style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
                    Don't have an account? 
                    <a th:href="@{/register}" style="color: var(--primary-color); font-weight: 600; text-decoration: none;">Register here</a>
                </p>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Smart Catering Services. All rights reserved.</p>
    </footer>
</body>
</html>

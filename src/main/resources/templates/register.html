<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Smart Catering Services</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v='2.0')}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="page-container">
        <div class="auth-card-container">
            <div class="auth-card">
                <h2>Create an Account</h2>
                <p class="auth-subtitle">Join Smart Catering Services as a customer or vendor</p>

                <!-- General Alert -->
                <div class="alert alert-error" th:if="${error != null and nameError == null and emailError == null and passwordError == null}" 
                     th:text="${error}"></div>

                <form th:action="@{/register}" method="post">
                    <div class="form-group">
                        <label for="name">Full Name / Business Name</label>
                        <input type="text" id="name" name="name" class="form-control" 
                               th:value="${name}" placeholder="e.g. John Doe or Gourmet Kitchen" required>
                        <span class="field-error" th:if="${nameError}" th:text="${nameError}"></span>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" class="form-control" 
                               th:value="${email}" placeholder="name@example.com" required>
                        <span class="field-error" th:if="${emailError}" th:text="${emailError}"></span>
                    </div>

                    <div class="form-group">
                        <label for="password">Password (min. 6 characters)</label>
                        <input type="password" id="password" name="password" class="form-control" 
                               placeholder="Create a secure password" required minlength="6">
                        <span class="field-error" th:if="${passwordError}" th:text="${passwordError}"></span>
                    </div>

                    <div class="form-group">
                        <label for="role">Account Type</label>
                        <select id="role" name="role" class="form-control" required>
                            <option value="CUSTOMER" th:selected="${role == null or role == 'CUSTOMER'}">Customer (Book catering slots)</option>
                            <option value="VENDOR" th:selected="${role == 'VENDOR'}">Vendor (Offer catering services &amp; slots)</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-accent btn-full">Register Account</button>
                </form>

                <p style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
                    Already have an account? 
                    <a th:href="@{/login}" style="color: var(--primary-color); font-weight: 600; text-decoration: none;">Sign in here</a>
                </p>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Smart Catering Services. All rights reserved.</p>
    </footer>
</body>
</html>

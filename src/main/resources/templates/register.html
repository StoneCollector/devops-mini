<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Smart Catering Services</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v='2.0')}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="page-container">
        <div class="auth-card-container">
            <div class="auth-card">
                <h2>Create an Account</h2>
                <p class="auth-subtitle">Join Smart Catering Services as a customer or vendor</p>

                <!-- General Alert -->
                <div class="alert alert-error" id="errorMessage" th:if="${error != null and nameError == null and emailError == null and passwordError == null}" 
                     th:text="${error}"></div>

                <form th:action="@{/register}" method="post">
                    <input type="hidden" name="redirect" th:value="${redirect != null ? redirect : param.redirect}">
                    <div class="form-group">
                        <label for="name">Full Name / Business Name</label>
                        <input type="text" id="name" name="name" class="form-control" 
                               th:value="${name}" placeholder="e.g. John Doe or Gourmet Kitchen" required>
                        <span class="field-error" id="nameError" th:if="${nameError}" th:text="${nameError}"></span>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" class="form-control" 
                               th:value="${email}" placeholder="name@example.com" required>
                        <span class="field-error" id="emailError" th:if="${emailError}" th:text="${emailError}"></span>
                    </div>

                    <div class="form-group">
                        <label for="password">Password (min. 6 characters)</label>
                        <input type="password" id="password" name="password" class="form-control" 
                               placeholder="Create a secure password" required minlength="6">
                        <span class="field-error" id="passwordError" th:if="${passwordError}" th:text="${passwordError}"></span>
                    </div>

                    <div class="form-group">
                        <label for="phoneNumber">Phone Number (Mandatory for orders &amp; delivery)</label>
                        <input type="tel" id="phoneNumber" name="phoneNumber" class="form-control" 
                               th:value="${phoneNumber}" placeholder="e.g. 9876543210" required>
                        <span class="field-error" id="phoneError" th:if="${phoneError}" th:text="${phoneError}"></span>
                    </div>

                    <div class="form-group">
                        <label for="addressLine">Street Address / Premises</label>
                        <input type="text" id="addressLine" name="addressLine" class="form-control" 
                               th:value="${addressLine}" placeholder="e.g. 42 MG Road, Suite 101" required>
                        <span class="field-error" id="addressError" th:if="${addressError}" th:text="${addressError}"></span>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label for="city">City</label>
                            <input type="text" id="city" name="city" class="form-control" 
                                   th:value="${city}" placeholder="e.g. Mumbai" required>
                            <span class="field-error" id="cityError" th:if="${cityError}" th:text="${cityError}"></span>
                        </div>
                        <div class="form-group">
                            <label for="pincode">Pincode</label>
                            <input type="text" id="pincode" name="pincode" class="form-control" 
                                   th:value="${pincode}" placeholder="e.g. 400001" required>
                            <span class="field-error" id="pincodeError" th:if="${pincodeError}" th:text="${pincodeError}"></span>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label for="organizationName">Organization (Optional)</label>
                            <input type="text" id="organizationName" name="organizationName" class="form-control" 
                                   th:value="${organizationName}" placeholder="e.g. Acme Corp (for billing)">
                        </div>
                        <div class="form-group">
                            <label for="gstNumber">GST Number (Optional)</label>
                            <input type="text" id="gstNumber" name="gstNumber" class="form-control" 
                                   th:value="${gstNumber}" placeholder="e.g. 27ABCDE1234F1Z5">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="role">Account Type</label>
                        <select id="role" name="role" class="form-control" required>
                            <option value="CUSTOMER" th:selected="${role == null or role == 'CUSTOMER'}">Customer (Book catering services &amp; events)</option>
                            <option value="VENDOR" th:selected="${role == 'VENDOR'}">Vendor (Provide catering, menus &amp; venues)</option>
                        </select>
                    </div>

                    <button type="submit" id="registerSubmitBtn" class="btn btn-accent btn-full">Register Account</button>
                </form>

                <p style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
                    Already have an account? 
                    <a th:href="@{/login(redirect=${redirect != null ? redirect : param.redirect})}" id="loginLink" style="color: var(--primary-color); font-weight: 600; text-decoration: none;">Sign in here</a>
                </p>
            </div>
        </div>
    </main>
</body>
</html>

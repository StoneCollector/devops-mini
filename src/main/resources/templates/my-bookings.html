<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CBMS - My Bookings</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <div><h2>CBMS</h2></div>
        <div>
            <a th:href="@{/}">Home</a>
            <a th:href="@{/logout}">Logout</a>
        </div>
    </header>

    <div class="container">
        <h1>My Bookings</h1>
        <p class="success" th:if="${param.success}">Booking successful!</p>

        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Time Slot</th>
                    <th>Menu Type</th>
                    <th>Guests</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="booking : ${bookings}">
                    <td th:text="${booking.slot.date}"></td>
                    <td th:text="${booking.slot.timeSlot}"></td>
                    <td th:text="${booking.slot.menuType}"></td>
                    <td th:text="${booking.numberOfGuests}"></td>
                    <td th:text="${booking.status}"></td>
                    <td>
                        <form th:if="${booking.status.name() != 'CANCELLED'}" th:action="@{/cancel-booking}" method="post">
                            <input type="hidden" name="bookingId" th:value="${booking.id}">
                            <button type="submit" class="btn-danger">Cancel</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(bookings)}">
                    <td colspan="6">You have no bookings.</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'Edit Cuisine' : 'New Cuisine'} + ' - Smart Catering Services'">Cuisine Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v='2.0')}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="page-container">
        <div class="page-header">
            <div class="page-title-group">
                <h1 th:text="${isEdit ? 'Edit Cuisine Offering' : 'Add New Cuisine Offering'}">New Cuisine</h1>
                <p class="page-subtitle">Configure menu style, dietary certifications, capacity constraints, and pricing</p>
            </div>
            <div>
                <a th:href="@{/vendor/cuisines}" class="btn btn-secondary">Back to Cuisines</a>
            </div>
        </div>

        <div class="alert alert-error" id="formError" th:if="${error}" th:text="${error}"></div>

        <div class="card" style="max-width: 800px; margin: 0 auto; padding: 2rem;">
            <form th:action="${isEdit ? '/vendor/cuisines/' + cuisine.id : '/vendor/cuisines'}" method="post">
                <div class="form-group">
                    <label for="cuisineName">Cuisine Package Title</label>
                    <input type="text" id="cuisineName" name="cuisineName" class="form-control" 
                           th:value="${cuisine.cuisineName}" placeholder="e.g. Traditional Awadhi Dastarkhwan or Continental Gala" required>
                </div>

                <div class="form-group">
                    <label>Serving Styles Offered</label>
                    <div style="display: flex; gap: 1.5rem; flex-wrap: wrap; margin-top: 0.5rem;">
                        <label th:each="style : ${allStyles}" style="display: flex; align-items: center; gap: 0.4rem; font-weight: normal; cursor: pointer;">
                            <input type="checkbox" name="serviceStyles" th:value="${style.name()}" 
                                   th:checked="${cuisine.serviceStyles != null and cuisine.serviceStyles.contains(style.name())}">
                            <span th:text="${style.displayName}">Buffet</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Dietary Certifications &amp; Flags</label>
                    <div style="display: flex; gap: 1.5rem; flex-wrap: wrap; margin-top: 0.5rem;">
                        <label th:each="flag : ${allDietary}" style="display: flex; align-items: center; gap: 0.4rem; font-weight: normal; cursor: pointer;">
                            <input type="checkbox" name="dietaryFlags" th:value="${flag.name()}" 
                                   th:checked="${cuisine.dietaryFlags != null and cuisine.dietaryFlags.contains(flag.name())}">
                            <span th:text="${flag.displayName}">Vegetarian</span>
                        </label>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="pricePerHead">Price per Head (₹)</label>
                        <input type="number" step="0.01" id="pricePerHead" name="pricePerHead" class="form-control" 
                               th:value="${cuisine.pricePerHead}" placeholder="e.g. 650.00">
                    </div>

                    <div class="form-group">
                        <label for="minGuests">Minimum Guests</label>
                        <input type="number" id="minGuests" name="minGuests" class="form-control" 
                               th:value="${cuisine.minGuests > 0 ? cuisine.minGuests : 15}" min="1" required>
                    </div>

                    <div class="form-group">
                        <label for="maxGuests">Maximum Capacity</label>
                        <input type="number" id="maxGuests" name="maxGuests" class="form-control" 
                               th:value="${cuisine.maxGuests > 0 ? cuisine.maxGuests : 500}" min="1" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="description">Menu Highlights &amp; Specialty Dishes</label>
                    <textarea id="description" name="description" class="form-control" rows="3" 
                              placeholder="Detail the course breakdown, signature starters, main curries, breads, desserts..." 
                              th:text="${cuisine.description}"></textarea>
                </div>

                <div class="form-group" th:if="${isEdit}">
                    <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                        <input type="checkbox" name="active" value="true" th:checked="${cuisine.active}">
                        <span>Active in Public Catalogue (Visible to Customers)</span>
                    </label>
                </div>

                <div style="margin-top: 1.5rem; display: flex; justify-content: flex-end; gap: 1rem;">
                    <a th:href="@{/vendor/cuisines}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" id="saveCuisineBtn" class="btn btn-primary" th:text="${isEdit ? 'Update Cuisine' : 'Save Cuisine'}">Save Cuisine</button>
                </div>
            </form>
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Smart Catering Services. All rights reserved.</p>
    </footer>
</body>
</html>

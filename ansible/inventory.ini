# inventory.ini - Ansible Inventory File for CBMS Deployment

[webservers]
# Target host definition (replace IP/hostname with your target VM/host)
# target-node ansible_host=127.0.0.1 ansible_port=22 ansible_user=ubuntu

[webservers:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_extra_args='-o StrictHostKeyChecking=no'

# Local runner group (use this if running directly on the WSL/Ubuntu machine)
[local]
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3
